name = "instructed_postgres"
version = "1.0.0"
description = "PostgreSQL event store adapter for Instructed CQRS/ES framework"
licences = ["MIT"]
target = "erlang"

[dependencies]
gleam_stdlib = ">= 0.44.0 and < 2.0.0"
gleam_erlang = ">= 1.3.0 and < 2.0.0"
gleam_otp = ">= 1.2.0 and < 2.0.0"
gleam_json = ">= 3.1.0 and < 4.0.0"
gleam_time = ">= 1.7.0 and < 2.0.0"
pog = ">= 4.1.0 and < 5.0.0"
youid = ">= 1.5.1 and < 2.0.0"
instructed = { path = "../instructed" }

[dev-dependencies]
gleeunit = ">= 1.0.0 and < 2.0.0"
