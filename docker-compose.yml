services:
  dev:
    build: .
    image: instructed-dev:latest
    stdin_open: true
    tty: true

    volumes:
      - .:/workspace
      - ~/.pi:/home/dev/.pi
      - pi-bin:/home/dev/.pi/agent/bin
      - ~/.ssh/known_hosts:/home/dev/.ssh/known_hosts:ro
      - ~/.gitconfig:/home/dev/.gitconfig:ro
      - ~/.claude:/home/dev/.claude
      - ~/.claude-container.json:/home/dev/.claude.json
      - /run/host-services/ssh-auth.sock:/run/ssh-agent.sock

    environment:
      - SSH_AUTH_SOCK=/run/ssh-agent.sock
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/app

    group_add:
      - root
    working_dir: /workspace
    depends_on:
      db:
        condition: service_healthy

    cap_drop:
      - ALL
    cap_add:
      - SYS_ADMIN
      - SETUID
      - SETGID

  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: app
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  pi-bin:
  pgdata:
