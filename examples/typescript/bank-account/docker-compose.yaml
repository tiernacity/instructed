services:
  postgres:
    image: postgres:16
    container_name: bank-account-postgres
    ports:
      # 5433 to avoid clashing with the repo-root docker-compose
      # (which exposes 5432 for the SDK + conformance suites).
      - "5433:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: bank_account
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d bank_account"]
      interval: 1s
      timeout: 3s
      retries: 30
